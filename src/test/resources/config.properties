# Defaults. Override any key on the command line, e.g. mvn test -Dbrowser=firefox -Dheadless=false
base.url=https://mb.io/en-AE
browser=chrome
headless=false
timeout.seconds=20
pageload.timeout.seconds=90

# Link checker: bot-protected / social domains that routinely answer 403/999 to scripts
linkcheck.skip.domains=linkedin.com,facebook.com,instagram.com,x.com,twitter.com,t.me,youtube.com,tiktok.com,googletagmanager.com
linkcheck.threads=8

# Expected minimum rows in the explore page spot market table
spot.min.pairs=10

# Fallback URL for About Us > Why MultiBank if it can't be found by link text
why.multibank.path=/en/about/why-multibank
